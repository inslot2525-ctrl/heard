# Render Blueprint: Dashboard → New → Blueprint → pick this repo. Everything runs in Singapore, next
# to the Neon database (ap-southeast-1) and the Nexconn app (Singapore data centre).
# Secrets marked `sync: false` are asked for once when the Blueprint is created; they never live in git.

services:
  - type: web
    name: heard-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @heard/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXCONN_API_HOST
        value: api.sg-light-api.com
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_PASSCODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Public URL of heard-web. Not `fromService … property: host`: that gives Render's internal
      # hostname ("heard-web"), not the public one, so CORS rejected the real site.
      - key: WEB_ORIGIN
        value: https://heard-web.onrender.com

  - type: web
    name: heard-web
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @heard/web build
    staticPublishPath: apps/web/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: VITE_NEXCONN_APP_KEY
        sync: false
      # Public URL of heard-api (Render added the "-htrg" suffix because "heard-api" was taken).
      - key: VITE_API_URL
        value: https://heard-api-htrg.onrender.com
